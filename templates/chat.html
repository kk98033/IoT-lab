<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>AI 聊天室</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            background: #eee;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 10px 10px 0 0;
        }

        .header a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
        }

        #chat-history {
            height: 400px;
            background: white;
            overflow-y: scroll;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .msg {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            width: fit-content;
            max-width: 80%;
        }

        .user {
            background: #dcf8c6;
            margin-left: auto;
            text-align: right;
        }

        .ai {
            background: #f1f0f0;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>使用者：{{ name }}</div>
        <a href="/logout">登出</a>
    </div>

    <div id="chat-history">
        <div class="msg ai">嗨！我是 AI 助教，有什麼問題都可以問我喔！</div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="輸入訊息...">
        <button onclick="sendMsg()">送出</button>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value;
            if (text === "") return;

            // 1. 先顯示自己的訊息
            addBubble(text, 'user');
            input.value = "";
            addBubble("思考中...", 'ai', true); // 顯示載入中

            // 2. 發送 API 給 Flask 後端
            try {
                const response = await fetch('/api/ask_ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // 3. 移除 "思考中..." 並顯示 AI 回答
                removeLoading();
                addBubble(data.reply, 'ai');

            } catch (error) {
                removeLoading();
                addBubble("系統錯誤：" + error, 'ai');
            }
        }

        // 輔助函式：新增對話泡泡
        function addBubble(text, type, isLoading = false) {
            const box = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            if (isLoading) div.id = "loading";
            box.appendChild(div);
            box.scrollTop = box.scrollHeight; // 捲動到底部
        }

        function removeLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }
    </script>

</body>

</html>
